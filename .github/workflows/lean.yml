# The Lean build and the self-test gate: the domain core must build, and the
# self-test (lake exe rectgtn_domain) must pass — the green gate for
# 2-contract's RECTGTN domain.  This mirrors 4-entities/godot-sandbox's green
# `build_gdscript_elf.yml` shape and the archived FBD repo's `lean.yml`
# (elan init + lake build + a `run_tests`-style gate).
#
# RFD 66606-2153 stage 1: the pure-Lean domain core builds and the self-test
# gate is green.  When the host-emitting `.c` intermediate lands (RFD
# 66606-2153 stage 3), this gate extends to the full C-ABI emission test.

name: Lean

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    name: Lean core + self-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean via elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain=leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        run: |
          lake build

      - name: Run the self-test gate
        run: |
          lake exe rectgtn_domain
          # green gate: the process must exit 0 (green) and print "ok:";
          # a refusal ("FAIL:") or a non-zero exit fails the workflow.
          # (We do not assert on the exit code here, because `lake exe`
          # propagates `IO` `exit` as the process exit code: 0 = ok, 1 =
          # self-test FAIL. The `run:` shell sees the process exit code
          # directly, so a non-zero exit fails the job without a special
          # assertion.)

      - name: Build the native ELF (lean core -> C)
        # Not yet available in Lean 4.35 (no native C backend). This step
        # is a placeholder for the RFD 66606-2153 stage-3 gate: once the
        # Lean core emits a `.c` intermediate that implements every
        # rectgtn_* symbol, this step will link it against the guest shim
        # and verify the `.sandbox_variant` section.  Until then it is a
        # commented-out placeholder so the workflow stays green.
        run: |
          echo "C-ABI emission gate pending (RFD 66606-2153 stage 3)"
          # (stage 3) lake build -n c-abi --target riscv64-linux
          # (stage 3) verify .sandbox_variant via objcopy + python SBXV/size gate
          # (stage 3) verify rectgtn_* symbols in .symtab via objdump
